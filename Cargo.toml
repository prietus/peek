[package]
name = "ipeek"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
image-webp = "0.2"
icy_sixel = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
