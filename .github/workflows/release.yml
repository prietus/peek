name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: peek-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: peek-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Import codesigning certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # Prepend our keychain to the user search list so codesign sees it.
          ORIG_KEYCHAINS=$(security list-keychains -d user | xargs)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $ORIG_KEYCHAINS

          echo "----- Identities visible to codesign -----"
          security find-identity -v -p codesigning
          echo "------------------------------------------"

          rm "$CERT_PATH"

      - name: Codesign binary (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/peek"

          # Resolve the identity by SHA-1 to avoid name-matching pitfalls.
          # Prefer the one whose CN matches MACOS_SIGNING_IDENTITY; fall back
          # to any Developer ID Application identity if only one is present.
          IDENTITIES=$(security find-identity -v -p codesigning)
          echo "$IDENTITIES"

          SHA=$(echo "$IDENTITIES" | grep -F "$MACOS_SIGNING_IDENTITY" | head -n1 | awk '{print $2}')
          if [ -z "${SHA:-}" ]; then
            SHA=$(echo "$IDENTITIES" | grep "Developer ID Application" | head -n1 | awk '{print $2}')
          fi
          if [ -z "${SHA:-}" ]; then
            echo "No Developer ID Application identity found in keychain." >&2
            exit 1
          fi
          echo "Using identity SHA: $SHA"

          codesign --force --timestamp --options runtime \
            --sign "$SHA" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"
          codesign --display --verbose=4 "$BIN" 2>&1 | grep -E '(Authority|TeamIdentifier|Timestamp)'

      - name: Notarize binary (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PWD: ${{ secrets.MACOS_NOTARY_PWD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          ZIP_PATH="$RUNNER_TEMP/peek-notarize.zip"
          ditto -c -k --keepParent \
            "target/${{ matrix.target }}/release/peek" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PWD" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --wait
          rm "$ZIP_PATH"

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/peek dist/peek
          cp README.md LICENSE dist/
          tar -C dist -czf ${{ matrix.archive }} peek README.md LICENSE
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
